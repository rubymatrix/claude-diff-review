<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Diff Review</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%23c96442%22/%3E%3Cpath d=%22M4 5h8M4 8h5M4 11h7%22 stroke=%22white%22 stroke-width=%221.6%22/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f7f9;--panel:#fff;--panel2:#f0f2f5;--line:#dfe3e8;--text:#1d232b;--muted:#68717d;--accent:#c96442;--accent-ink:#fff;
  --add-bg:#e7f6ec;--add-hl:#b6e6c4;--add-ln:#d2efdb;--del-bg:#fdecec;--del-hl:#f6c2c2;--del-ln:#f8dada;--gap:#eef1f5;
  --ok:#1f8a4c;--warn:#b7791f;--bad:#c53030;--info:#2b6cb0;--shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#14161a;--panel:#1b1e23;--panel2:#22262c;--line:#2e333a;--text:#e3e6ea;--muted:#959ca6;--accent:#e07a55;--accent-ink:#111;
  --add-bg:#13261b;--add-hl:#1f5133;--add-ln:#183223;--del-bg:#2c1717;--del-hl:#6a2626;--del-ln:#391c1c;--gap:#1f2329;
  --ok:#48bb78;--warn:#ecc94b;--bad:#fc8181;--info:#63b3ed;--shadow:none;}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 10px}
button:hover{border-color:var(--muted)}
a{color:var(--info)}
select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button:disabled{opacity:.5;cursor:default}
textarea{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:8px;resize:vertical}
textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
code,.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}
header{height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:15px;margin:0;white-space:nowrap}
header .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;border:1px solid var(--line);white-space:nowrap}
.pill.waiting{border-color:var(--accent);color:var(--accent);animation:pulse 1.6s infinite}
.pill.working{color:var(--info);border-color:var(--info)}
@keyframes pulse{50%{opacity:.45}}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.on{background:var(--ok)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:4px 10px}
.seg button.on{background:var(--panel2);font-weight:600}
.toggle{display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap;cursor:pointer}
.layout{display:grid;grid-template-columns:290px minmax(0,1fr) 370px;height:calc(100% - 52px)}
aside,.composer{overflow:auto;background:var(--panel);border-right:1px solid var(--line)}
.composer{border-right:0;border-left:1px solid var(--line);display:flex;flex-direction:column}
main{overflow:auto;padding:16px 20px 80px}
.sec{padding:12px 14px;border-bottom:1px solid var(--line)}
.sec h2{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px;display:flex;justify-content:space-between}
.sess{padding:8px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent;margin-bottom:4px}
.sess:hover{background:var(--panel2)}
.sess.on{border-color:var(--accent);background:var(--panel2)}
.sess .t{font-weight:600;display:flex;justify-content:space-between;gap:6px}
.sess .p{font-family:var(--mono);font-size:11px;color:var(--muted);word-break:break-all}
.file{display:flex;gap:8px;align-items:flex-start;padding:5px 8px;border-radius:6px;cursor:pointer;font-family:var(--mono);font-size:11.5px;word-break:break-all}
.file:hover{background:var(--panel2)}
.file.on{background:var(--panel2);outline:1px solid var(--accent)}
.file .n{margin-left:auto;white-space:nowrap;color:var(--muted)}
.st-dot{width:8px;height:8px;border-radius:2px;margin-top:4px;flex:none;background:var(--line)}
.st-approved{background:var(--ok)}.st-rejected{background:var(--bad)}.st-needs-work{background:var(--warn)}
.tabs{display:flex;gap:6px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.tabs .tab{border-radius:999px}
.tabs .tab.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 10px;font-family:var(--mono);font-size:11.5px;max-width:100%}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{border:0;padding:0 6px;background:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:16px;box-shadow:var(--shadow);overflow:hidden;min-height:60px}
.card.focus{outline:2px solid var(--accent)}
.card.v-approved{border-left:4px solid var(--ok)}.card.v-rejected{border-left:4px solid var(--bad)}.card.v-needs-work{border-left:4px solid var(--warn)}
.card-h{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.seq{font-weight:700;color:var(--muted)}
.tool{font-size:11px;font-weight:700;padding:1px 7px;border-radius:4px;background:var(--line)}
.tool.Bash{background:#6b46c1;color:#fff}.tool.Write{background:#2b6cb0;color:#fff}.tool.Edit,.tool.MultiEdit{background:#2f855a;color:#fff}.tool.NotebookEdit{background:#b7791f;color:#fff}
.path{font-family:var(--mono);font-size:12.5px;word-break:break-all;flex:1;min-width:200px}
.path .dir{color:var(--muted)}
.path b{font-weight:700}
.stat{font-family:var(--mono);font-size:12px;white-space:nowrap}.stat .a{color:var(--ok)}.stat .d{color:var(--bad)}
.verdicts{display:flex;gap:4px}
.verdicts button{font-size:12px;padding:3px 8px}
.verdicts button.on[data-v=approved]{background:var(--ok);border-color:var(--ok);color:#fff}
.verdicts button.on[data-v=needs-work]{background:var(--warn);border-color:var(--warn);color:#111}
.verdicts button.on[data-v=rejected]{background:var(--bad);border-color:var(--bad);color:#fff}
.card-sub{padding:6px 12px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);display:flex;gap:12px;flex-wrap:wrap}
.card-sub code{background:var(--panel2);padding:1px 5px;border-radius:4px;color:var(--text);word-break:break-all}
.sent{color:var(--ok);font-size:11px;font-weight:600}
.card-note{padding:8px 12px;border-top:1px solid var(--line)}
.card-note textarea{min-height:34px;height:34px;font-size:13px}
.diffwrap{overflow-x:auto}
table.diff{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12.5px;line-height:1.5}
table.diff td{padding:0 8px;vertical-align:top;white-space:pre}
td.ln{width:1%;min-width:44px;text-align:right;color:var(--muted);user-select:none;cursor:pointer;border-right:1px solid var(--line)}
td.ln:hover{color:var(--accent);text-decoration:underline}
td.code{width:auto}
table.diff.split{table-layout:fixed}
table.diff.split td.code{white-space:pre-wrap;word-break:break-all}
td.code .sg{user-select:none;color:var(--muted);display:inline-block;width:14px}
tr.add td.code,tr.add td.code-r{background:var(--add-bg)}tr.add td.ln{background:var(--add-ln)}
tr.del td.code{background:var(--del-bg)}tr.del td.ln{background:var(--del-ln)}
td.c-add{background:var(--add-bg)}td.c-del{background:var(--del-bg)}td.l-add{background:var(--add-ln)}td.l-del{background:var(--del-ln)}td.c-empty{background:var(--gap)}
mark.ia{background:var(--add-hl);color:inherit;border-radius:2px}mark.id{background:var(--del-hl);color:inherit;border-radius:2px}
tr.gap td{background:var(--gap);color:var(--info);cursor:pointer;font-size:12px;padding:3px 10px;font-family:system-ui,sans-serif}
tr.gap td:hover{text-decoration:underline}
tr.cmt td{white-space:normal;background:var(--panel2);padding:8px 12px;font-family:system-ui,sans-serif;font-size:13px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.cbox{border-left:3px solid var(--accent);padding:4px 10px;margin:2px 0;background:var(--panel);border-radius:4px;display:flex;gap:8px;align-items:flex-start}
.cbox .txt{flex:1;white-space:pre-wrap}
.cbox button{font-size:11px;padding:1px 6px}
.empty{padding:40px;text-align:center;color:var(--muted)}
.notice{padding:14px;color:var(--muted);font-size:13px}
.composer .body{padding:14px;display:flex;flex-direction:column;gap:10px;flex:1}
.composer h3{margin:0;font-size:15px}
.counts{display:flex;gap:6px;flex-wrap:wrap}
.counts span{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
#prompt{font-family:var(--mono);font-size:12px;min-height:260px;flex:1}
#general{min-height:70px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.banner{padding:10px 12px;border-radius:8px;font-size:13px;border:1px solid var(--line);background:var(--panel2)}
.banner.waiting{border-color:var(--accent)}
.queued{font-size:12px;border:1px dashed var(--line);border-radius:6px;padding:6px 8px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
@media (max-width:1100px){.layout{grid-template-columns:240px minmax(0,1fr)}.composer{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}.layout{height:auto}html,body{height:auto}}
@media (max-width:700px){.layout{grid-template-columns:1fr}aside{max-height:40vh}header{flex-wrap:wrap;height:auto;padding:8px 16px}main{padding:12px 16px 60px}}
</style>
</head>
<body>
<header>
  <h1>◧ Claude Diff Review</h1>
  <span id="statePill"></span>
  <span class="sp"></span>
  <div class="seg" id="modeSeg"><button data-m="unified" class="on">Unified</button><button data-m="split">Split</button></div>
  <label class="toggle" title="When on, Claude pauses at the end of each turn that changed files until you send feedback or approve."><input type="checkbox" id="gate"> Hold Claude for review</label>
  <span class="pill"><span class="dot" id="live"></span><span id="liveTxt">offline</span></span>
</header>
<div class="layout">
  <aside>
    <div class="sec"><h2>Sessions</h2><div id="sessions"></div></div>
    <div class="sec"><h2><span>Changed files</span><span id="fileCount"></span></h2><div id="files"></div></div>
    <div class="sec muted" style="font-size:12px">
      Shortcuts: <span class="kbd">j</span>/<span class="kbd">k</span> move ·
      <span class="kbd">a</span> approve · <span class="kbd">n</span> needs work · <span class="kbd">r</span> reject ·
      click a line number to comment
    </div>
  </aside>
  <main id="main"><div class="empty">Waiting for Claude Code to change something…</div></main>
  <section class="composer">
    <div class="body">
      <div class="row" style="justify-content:space-between"><h3>Feedback to Claude</h3><span class="counts" id="counts"></span></div>
      <div id="banner"></div>
      <label class="muted" style="font-size:12px">General notes</label>
      <textarea id="general" placeholder="Anything Claude should know or do overall…"></textarea>
      <div class="row" style="justify-content:space-between"><label class="muted" style="font-size:12px">Prompt that will be sent (editable)</label><button id="regen" style="font-size:12px">Regenerate</button></div>
      <textarea id="prompt" spellcheck="false" placeholder="Approve, reject or comment on changes — the prompt builds itself here."></textarea>
      <div class="row">
        <label class="muted" style="font-size:12px">Deliver to</label>
        <select id="target"><option value="session">this session</option><option value="project">next session in this project</option></select>
      </div>
      <div class="row">
        <button class="primary" id="send">Send to Claude</button>
        <button id="release" style="display:none">Approve all &amp; let Claude continue</button>
        <button id="copy">Copy</button>
      </div>
      <div id="queued"></div>
    </div>
  </section>
</div>
<div class="toast" id="toast"></div>
<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clientId = Math.random().toString(36).slice(2);
const CTX = 3;
const st = {
  sessions: [], sid: null, data: null, changes: [], review: null, view: 'changes', mode: 'unified', file: null,
  blobs: new Map(), expanded: new Set(), full: new Set(), draft: null, focus: -1, promptDirty: false, config: {}, sig: '',
};
try { st.mode = localStorage.getItem('dr.mode') || 'unified'; st.view = localStorage.getItem('dr.view') || 'changes'; } catch {}

// ---------------- API ----------------
const api = async (method, url, body) => {
  const r = await fetch(url, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.json();
};
async function blob(ref) {
  if (!ref || !ref.sha) return null;
  if (!st.blobs.has(ref.sha)) st.blobs.set(ref.sha, fetch('/api/blob/' + ref.sha).then((r) => (r.ok ? r.text() : '')));
  return st.blobs.get(ref.sha);
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2200); }
let saveTimer = null;
function saveReview() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => { saveTimer = null; try { await api('PUT', `/api/sessions/${encodeURIComponent(st.sid)}/review`, { review: st.review, clientId }); } catch (e) { toast('Save failed: ' + e.message); } }, 300);
  refreshPrompt();
}

// ---------------- diff engine (Myers, line based) ----------------
function splitLines(t) { if (t == null) return []; const a = t.split('\n'); if (a.length && a[a.length - 1] === '') a.pop(); return a; }
function diffLines(a, b) {
  let pre = 0; while (pre < a.length && pre < b.length && a[pre] === b[pre]) pre++;
  let suf = 0; while (suf < a.length - pre && suf < b.length - pre && a[a.length - 1 - suf] === b[b.length - 1 - suf]) suf++;
  const A = a.slice(pre, a.length - suf), B = b.slice(pre, b.length - suf), N = A.length, M = B.length;
  const ops = [];
  for (let i = 0; i < pre; i++) ops.push({ t: '=', a: i, b: i });
  let mid = [];
  if (!N || !M) { for (let i = 0; i < N; i++) mid.push({ t: '-', a: i }); for (let j = 0; j < M; j++) mid.push({ t: '+', b: j }); }
  else {
    const MAX = N + M, off = MAX + 1, V = new Int32Array(2 * MAX + 3), trace = []; let done = false, D = 0;
    for (let d = 0; d <= MAX && !done; d++) {
      trace.push(V.slice(off - d - 1, off + d + 2));
      if (d > 3000) { trace.length = 0; break; } // pathological: fall back to replace-all
      for (let k = -d; k <= d; k += 2) {
        let x = (k === -d || (k !== d && V[off + k - 1] < V[off + k + 1])) ? V[off + k + 1] : V[off + k - 1] + 1, y = x - k;
        while (x < N && y < M && A[x] === B[y]) { x++; y++; }
        V[off + k] = x;
        if (x >= N && y >= M) { done = true; D = d; break; }
      }
    }
    if (!done) { for (let i = 0; i < N; i++) mid.push({ t: '-', a: i }); for (let j = 0; j < M; j++) mid.push({ t: '+', b: j }); }
    else {
      let x = N, y = M; const rev = [];
      for (let d = D; d >= 0; d--) {
        const Vd = trace[d], g = (k) => Vd[k + d + 1], k = x - y;
        const pk = (k === -d || (k !== d && g(k - 1) < g(k + 1))) ? k + 1 : k - 1;
        const px = g(pk), py = px - pk;
        while (x > px && y > py) { rev.push({ t: '=', a: x - 1, b: y - 1 }); x--; y--; }
        if (d > 0) rev.push(x === px ? { t: '+', b: y - 1 } : { t: '-', a: x - 1 });
        x = px; y = py;
      }
      mid = rev.reverse();
    }
  }
  for (const o of mid) ops.push({ t: o.t, a: o.a == null ? undefined : o.a + pre, b: o.b == null ? undefined : o.b + pre });
  for (let i = 0; i < suf; i++) ops.push({ t: '=', a: a.length - suf + i, b: b.length - suf + i });
  return ops;
}
function intraline(o, n) {
  if (o.length > 600 || n.length > 600) return [esc(o), esc(n)];
  let p = 0; while (p < o.length && p < n.length && o[p] === n[p]) p++;
  let s = 0; while (s < o.length - p && s < n.length - p && o[o.length - 1 - s] === n[n.length - 1 - s]) s++;
  const w = (str, cls) => esc(str.slice(0, p)) + (str.length - s > p ? `<mark class="${cls}">${esc(str.slice(p, str.length - s))}</mark>` : '') + esc(str.slice(str.length - s));
  if (p + s === 0) return [esc(o), esc(n)];
  return [w(o, 'id'), w(n, 'ia')];
}

// Build display rows with line numbers (1-based) and inline highlighting.
function buildRows(beforeTxt, afterTxt) {
  const a = splitLines(beforeTxt).map((l) => l.replace(/\r$/, '')), b = splitLines(afterTxt).map((l) => l.replace(/\r$/, ''));
  const ops = diffLines(a, b);
  const rows = ops.map((o) => ({ t: o.t, ol: o.a != null ? o.a + 1 : null, nl: o.b != null ? o.b + 1 : null, text: o.t === '+' ? b[o.b] : a[o.a] }));
  for (let i = 0; i < rows.length;) { // pair runs of -/+ for intraline marks
    if (rows[i].t !== '-') { i++; continue; }
    let j = i; while (j < rows.length && rows[j].t === '-') j++;
    let k = j; while (k < rows.length && rows[k].t === '+') k++;
    for (let x = 0; x < Math.min(j - i, k - j); x++) { const [h1, h2] = intraline(rows[i + x].text, rows[j + x].text); rows[i + x].html = h1; rows[j + x].html = h2; rows[i + x].pair = rows[j + x]; }
    i = k;
  }
  let add = 0, del = 0; rows.forEach((r) => { if (r.t === '+') add++; else if (r.t === '-') del++; });
  return { rows, add, del };
}
// Mark which rows are visible given context and expanded gaps.
function segments(rows, key) {
  if (st.full.has(key)) return [{ type: 'rows', from: 0, to: rows.length }];
  const show = new Uint8Array(rows.length);
  rows.forEach((r, i) => { if (r.t !== '=') for (let j = Math.max(0, i - CTX); j <= Math.min(rows.length - 1, i + CTX); j++) show[j] = 1; });
  const segs = []; let i = 0;
  while (i < rows.length) {
    let j = i; const v = show[i];
    while (j < rows.length && show[j] === v) j++;
    if (v || st.expanded.has(key + ':' + i) || j - i <= 2) segs.push({ type: 'rows', from: i, to: j });
    else segs.push({ type: 'gap', from: i, to: j });
    i = j;
  }
  return segs;
}

// ---------------- rendering ----------------
const commentsFor = (key) => (st.review?.comments || []).filter((c) => c.anchor.key === key);
function commentRow(cols, key, side, line) {
  const list = commentsFor(key).filter((c) => c.anchor.side === side && c.anchor.line === line);
  const isDraft = st.draft && st.draft.key === key && st.draft.side === side && st.draft.line === line;
  if (!list.length && !isDraft) return '';
  let h = list.map((c) => `<div class="cbox"><div class="txt">${esc(c.text)}</div>${c.sent ? '<span class="sent">sent</span>' : ''}<button data-act="delc" data-id="${c.id}">delete</button></div>`).join('');
  if (isDraft) h += `<div style="margin-top:6px"><textarea class="draft" rows="3" placeholder="Comment on ${side === 'new' ? 'new' : 'old'} line ${line}…  (⌘/Ctrl+Enter to save)"></textarea><div class="row" style="margin-top:6px"><button class="primary" data-act="savec">Add comment</button><button data-act="cancelc">Cancel</button></div></div>`;
  return `<tr class="cmt"><td colspan="${cols}">${h}</td></tr>`;
}
function renderDiffTable(rows, key) {
  const segs = segments(rows, key), split = st.mode === 'split', cols = split ? 4 : 3;
  let h = split ? `<table class="diff split"><colgroup><col style="width:52px"><col><col style="width:52px"><col></colgroup>` : `<table class="diff">`;

// ---------------- feedback prompt ----------------
function hunkText(rows, max = 40) {

    if (i - last > 1 && out.length) out.push('@@');

}

  const noted = unsent.filter((c) => !['rejected', 'needs-work'].includes(R.verdicts[c.id]) && (R.notes[c.id] || '').trim());

  const L = ['[diff-review] The user reviewed the file changes you made in this session. All paths are absolute. Address every item below, then briefly summarize what you did for each one.', ''];
  const section = async (title, list) => {
    if (!list.length) return;
    L.push(`## ${title}`);
    for (const c of list) {
      L.push(`### ${c.file}  (change #${c.seq}, ${c.tool} at ${fmtTime(c.ts)})`);
      if ((R.notes[c.id] || '').trim()) L.push(`Reviewer note: ${R.notes[c.id].trim()}`);

    comments.forEach((c) => { if (!byFile.has(c.anchor.file)) byFile.set(c.anchor.file, []); byFile.get(c.anchor.file).push(c); });
    for (const [f, list] of byFile) {

$('#release').onclick = async () => {
  st.changes.forEach((c) => { if (!st.review.verdicts[c.id]) st.review.verdicts[c.id] = 'approved'; });
  saveReview(); await api('POST', `/api/sessions/${encodeURIComponent(st.sid)}/release`); toast('Claude released'); refresh();
};
$('#send').onclick = async () => {
  const text = $('#prompt').value.trim();
  if (!text) return toast('Nothing to send yet — approve, reject or comment first');
  await api('POST', `/api/sessions/${encodeURIComponent(st.sid)}/feedback`, { text, target: $('#target').value });
  const R = st.review;
  st.changes.forEach((c) => { if (R.verdicts[c.id] || (R.notes[c.id] || '').trim()) R.sent[c.id] = true; });
  R.comments.forEach((c) => (c.sent = true));
  R.general = '';
  (R.log = R.log || []).push({ ts: Date.now(), text });
  st.promptDirty = false;
  saveReview(); toast(st.data.state.waiting ? 'Sent — Claude is on it' : 'Queued — Claude will receive it next'); renderMain(); refresh();
};

// ---------------- live updates ----------------
function connect() {
  const es = new EventSource('/api/events');
  es.onopen = () => { $('#live').classList.add('on'); $('#liveTxt').textContent = 'live'; };
  es.onmessage = (m) => { let d = {}; try { d = JSON.parse(m.data); } catch {} refresh(d); };
  es.onerror = () => { $('#live').classList.remove('on'); $('#liveTxt').textContent = 'reconnecting'; };
}
(async () => {
  const m = location.hash.match(/^#\/s\/(.+)$/);
  st.config = await api('GET', '/api/config').catch(() => ({}));
  await loadSessions().catch(() => {});
  if (m) await selectSession(decodeURIComponent(m[1]));
  else if (st.sessions[0]) await selectSession(st.sessions[0].id);
  else renderAll();
  connect();
  setInterval(() => { renderSidebar(); }, 30000);
})();
</script>
